<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Soft glow -->
  <circle cx="512" cy="540" r="360" fill="url(#glow)"/>

  <!-- Open book -->
  <g transform="translate(512 580)" filter="url(#shadow)">
    <!-- Page shadows behind -->
    <path d="M 0,-80
             Q -200,-130 -340,-70
             L -340,200
             Q -200,150 0,170 Z"
          fill="#a16207" opacity="0.3" transform="translate(6 8)"/>
    <path d="M 0,-80
             Q 200,-130 340,-70
             L 340,200
             Q 200,150 0,170 Z"
          fill="#a16207" opacity="0.3" transform="translate(-6 8)"/>

    <!-- Left page -->
    <path d="M 0,-80
             Q -200,-130 -340,-70
             L -340,200
             Q -200,150 0,170 Z"
          fill="url(#page)"
          stroke="#92400e" stroke-width="5"/>
    <!-- Right page -->
    <path d="M 0,-80
             Q 200,-130 340,-70
             L 340,200
             Q 200,150 0,170 Z"
          fill="url(#page)"
          stroke="#92400e" stroke-width="5"/>

    <!-- Left page lines -->
    <g stroke="#a16207" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="-260" y1="-30" x2="-50" y2="-50"/>
      <line x1="-280" y1="20"  x2="-50" y2="0"/>
      <line x1="-290" y1="70"  x2="-50" y2="50"/>
      <line x1="-285" y1="120" x2="-50" y2="100"/>
    </g>
    <!-- Right page lines -->
    <g stroke="#a16207" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="50" y1="-50" x2="260" y2="-30"/>
      <line x1="50" y1="0"   x2="280" y2="20"/>
      <line x1="50" y1="50"  x2="290" y2="70"/>
      <line x1="50" y1="100" x2="285" y2="120"/>
    </g>
  </g>

  <!-- Golden heart above book -->
  <g transform="translate(512 340)" filter="url(#shadow)">
    <path d="M 0,80
             C -90,0 -210,30 -210,130
             C -210,210 -100,290 0,360
             C 100,290 210,210 210,130
             C 210,30 90,0 0,80 Z"
          fill="url(#gold)"
          stroke="#78350f" stroke-width="5"/>
    <!-- Highlight on heart -->
    <ellipse cx="-70" cy="120" rx="40" ry="22" fill="#fef9c3" opacity="0.7" transform="rotate(-30 -70 120)"/>
  </g>
</svg>
